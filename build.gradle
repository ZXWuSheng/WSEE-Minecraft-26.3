plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '0.1.1'
group = 'cn.wusheng'

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

base {
    archivesName = 'WSEE'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.3.0.6-beta'
    validateAccessTransformers = false

    runs {
        client {
            client()
        }
    }

    mods {
        wsee {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveFileName = "WSEE-${project.version}-NeoForge.jar"
}

tasks.register('regressionTest', JavaExec) {
    group = 'verification'
    description = 'Checks loader-independent enchantment values without starting Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.wusheng.oatz.enchantment.EnchantmentValuesRegression'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test') {
    exclude '**/EnchantmentValuesRegression.class'
}

tasks.named('check') {
    dependsOn tasks.named('regressionTest')
}
