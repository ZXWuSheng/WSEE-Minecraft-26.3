plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '0.1.0'
group = 'cn.wusheng'

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

base {
    archivesName = 'WSEE'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.3.0.6-beta'
    validateAccessTransformers = false

    runs {
        client {
            client()
        }
    }

    mods {
        wsee {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveFileName = "WSEE-${project.version}-NeoForge.jar"
}

sourceSets.test {
    // The collision fixtures use Minecraft's math types without launching a game.
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

tasks.named('test') {
    // The collision fixtures run through their JavaExec task, not a JUnit runner.
    exclude '**/FlyingHookCollisionTest.class'
}

tasks.register('testFlyingHookCollision', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.wusheng.oatz.FlyingHookCollisionTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('check') {
    dependsOn 'testFlyingHookCollision'
}
